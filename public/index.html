<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Server</title>
  <style>
    /* Colors in one place so they're easy to change */
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
    }

    /* Dark mode follows the visitor's system setting */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --surface: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --border: #1f2937;
        --accent: #818cf8;
        --accent-soft: #1e1b4b;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ---------- Nav bar ---------- */
    .navbar {
      position: sticky;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 4px;
      list-style: none;
    }

    .nav-links a {
      display: block;
      padding: 8px 14px;
      border-radius: 8px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s, background 0.15s;
    }

    .nav-links a:hover {
      color: var(--text);
      background: var(--accent-soft);
    }

    /* The link for the page you're on */
    .nav-links a.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* ---------- Page content ---------- */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .lead {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 560px;
    }

    /* On small screens, tighten the nav spacing */
    @media (max-width: 480px) {
      .nav-inner { padding: 0 16px; }
      .nav-links a { padding: 8px 10px; }
      main { padding: 48px 16px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="logo">My Server</a>
      <ul class="nav-links">
        <li><a href="/" class="active">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <h1>Welcome to My Server</h1>
    <p class="lead">This page is being served by Node.js and Express. I built this myself.</p>
  </main>
</body>
</html>
